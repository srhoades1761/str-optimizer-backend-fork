# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo and the `launch` branch.
# Creates the API, the brief worker, a daily monthly-brief scheduler and the database.
# Secrets marked `sync: false` are asked for once, on the setup screen.

databases:
  - name: str-optimizer-db
    plan: 0.1c-256mb
    databaseName: str_optimizer

envVarGroups:
  - name: str-optimizer-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FRONTEND_URL
        value: https://optimizemystr.com
      - key: API_BASE_URL            # unsubscribe links go through the website's /api forward
        value: https://optimizemystr.com
      - key: BRIEF_FROM_EMAIL
        value: briefs@optimizemystr.com
      - key: SUPPORT_EMAIL
        value: support@optimizemystr.com
      - key: STRIPE_PRICE_MONTHLY
        value: price_1U5YijRvCUJT12uKVmU1JpKi
      - key: STRIPE_PRICE_ANNUAL
        value: price_1U5YijRvCUJT12uKEgUKLGJz

services:
  - type: web
    name: str-optimizer-api
    runtime: python
    plan: 0.5c-512mb
    branch: launch
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn_config.py app:app
    healthCheckPath: /health
    envVars:
      - fromGroup: str-optimizer-shared
      - key: DATABASE_URL
        fromDatabase: {name: str-optimizer-db, property: connectionString}
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UNSUBSCRIBE_SECRET      # signs unsubscribe links; generated once, shared with the worker
        generateValue: true

  - type: worker
    name: str-optimizer-worker
    runtime: python
    plan: 0.5c-512mb
    branch: launch
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py --loop
    envVars:
      - fromGroup: str-optimizer-shared
      - key: DATABASE_URL
        fromDatabase: {name: str-optimizer-db, property: connectionString}
      - key: SENDGRID_API_KEY
        sync: false
      - key: UNSUBSCRIBE_SECRET
        fromService: {type: web, name: str-optimizer-api, envVarKey: UNSUBSCRIBE_SECRET}
      - key: AIRROI_API_KEY          # optional: without it the market section is left out
        sync: false
      - key: OPENAI_API_KEY          # optional: without it there is no title rewrite
        sync: false
      - key: BRIEF_LLM_MODEL
        sync: false

  - type: cron
    name: str-optimizer-monthly
    runtime: python
    plan: 0.5c-512mb
    branch: launch
    schedule: "0 15 * * *"           # daily, 9am Mountain: queues briefs that are 30+ days old
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py --enqueue-monthly
    envVars:
      - fromGroup: str-optimizer-shared
      - key: DATABASE_URL
        fromDatabase: {name: str-optimizer-db, property: connectionString}
